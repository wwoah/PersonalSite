<!--
  Favicon: a white chess bishop.

  White fill with a heavy ink outline, so it reads on light and dark
  browser tabs alike. Drawn on a 64-unit grid with a stroke thick
  enough to stay a full pixel wide when shrunk to 16px. Shapes are
  listed back to front; each one hides the seam of the one before.

  public/favicon.ico is rendered from this file. Re-export it if the
  drawing changes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <g fill="#ffffff" stroke="#15171a" stroke-width="3.5" stroke-linejoin="round">
    <!-- Stem: flares from the collar down to the base -->
    <path d="M25 40.5 C25 45 22 49 15 52 H49 C42 49 39 45 39 40.5 Z" />

    <!-- Base -->
    <path d="M9 60 H55 V57 A5 5 0 0 0 50 52 H14 A5 5 0 0 0 9 57 Z" />

    <!-- Mitre: the pointed head -->
    <path d="M32 10 C24.5 15 18.5 21.5 18.5 28 C18.5 32.5 21 35.5 23 37 H41 C43 35.5 45.5 32.5 45.5 28 C45.5 21.5 39.5 15 32 10 Z" />

    <!-- Collar -->
    <rect x="20" y="36.5" width="24" height="5" rx="2.5" />

    <!-- Ball on top -->
    <circle cx="32" cy="6" r="4" />
  </g>

  <!-- The bishop's diagonal notch, cut across the mitre -->
  <path d="M38.5 19 L29.5 28" fill="none" stroke="#15171a" stroke-width="3.5" stroke-linecap="round" />
</svg>
