<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0c0d" />
    <title>~/phillip — pwsh</title>

    <!-- Linked here rather than @import-ed from CSS: an @import cannot
         begin downloading until the importing stylesheet has been
         fetched and parsed, which serialises two round trips before any
         real type renders.

         One family only. The page is set entirely in monospace — display
         sizes are the same face at 800, so there is no second font to
         wait on and no reflow when the heading font lands separately
         from the body font. Italic is carried for comment syntax. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300..800;1,300..800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
