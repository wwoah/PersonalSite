<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- White chess bishop. Browsers that understand SVG icons take the
         second line; the .ico is the fallback for those that don't. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3efe7" />
    <title>Phillip Bishop — Software, AI &amp; IT Support · Bay Area</title>
    <meta
      name="description"
      content="Phillip Bishop is a software developer and IT generalist based in Danville, CA, working on site across the San Francisco Bay Area and remotely: custom programming, AI integrations and automation, Azure and Docker deployments, PC builds and repairs, and plain-English tech support."
    />

    <!-- Linked here rather than @import-ed from CSS: an @import cannot
         begin downloading until the importing stylesheet has been
         fetched and parsed, which serialises two round trips before any
         real type renders.

         Three faces, one job each: Instrument Serif for display, Geist
         for reading, Geist Mono for labels and for the glyphs the ASCII
         reveal draws while content decodes into place. -->
    <!-- Puts back a visitor's chosen accent before anything paints, so a
         returning visit never flashes aquamarine first. The values are
         the ones src/theme/accent.ts derived and saved; anything that
         doesn't look like a --token: #hex pair is ignored. -->
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem("site.accent") || "null");
        if (saved && saved.vars) {
          for (var k in saved.vars) {
            if (/^--[a-z-]+$/.test(k) && /^#[0-9a-f]{6}$/i.test(saved.vars[k])) {
              document.documentElement.style.setProperty(k, saved.vars[k]);
            }
          }
        }
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
