<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#15171a" opacity=".16"/>
    </pattern>
  </defs>
  <rect width="640" height="420" fill="#e9e3d7"/>
  <rect width="640" height="420" fill="url(#dots)"/>

  <!-- open tower, side panel off -->
  <g transform="translate(150 40)">
    <rect x="7" y="9" width="250" height="330" rx="18" fill="#15171a"/>
    <rect width="250" height="330" rx="18" fill="#f8f6f1" stroke="#15171a" stroke-width="3"/>
    <!-- motherboard -->
    <rect x="20" y="20" width="176" height="210" rx="8" fill="#e9e3d7" stroke="#15171a" stroke-width="2"/>
    <path d="M30 40h40M30 52h28M150 214h36M150 202h24" stroke="#15171a" stroke-width="2" opacity=".35"/>
    <!-- cpu cooler -->
    <rect x="54" y="44" width="78" height="78" rx="10" fill="#f8f6f1" stroke="#15171a" stroke-width="2.5"/>
    <circle cx="93" cy="83" r="28" fill="#ff5a1f" stroke="#15171a" stroke-width="2.5"/>
    <g stroke="#15171a" stroke-width="2.5" stroke-linecap="round">
      <path d="M93 60v14M93 92v14M70 83h14M102 83h14"/>
    </g>
    <circle cx="93" cy="83" r="6" fill="#15171a"/>
    <!-- ram -->
    <g fill="#15171a">
      <rect x="148" y="40" width="10" height="92" rx="3"/>
      <rect x="166" y="40" width="10" height="92" rx="3"/>
    </g>
    <g fill="#ff5a1f">
      <rect x="149" y="46" width="8" height="10" rx="2"/>
      <rect x="167" y="46" width="8" height="10" rx="2"/>
    </g>
    <!-- gpu -->
    <rect x="34" y="152" width="200" height="54" rx="10" fill="#15171a"/>
    <g fill="#f8f6f1" stroke="#15171a" stroke-width="2">
      <circle cx="82" cy="179" r="19"/>
      <circle cx="140" cy="179" r="19"/>
    </g>
    <g stroke="#15171a" stroke-width="2" stroke-linecap="round">
      <path d="M82 166v26M69 179h26M140 166v26M127 179h26"/>
    </g>
    <rect x="178" y="166" width="42" height="8" rx="4" fill="#ff5a1f"/>
    <!-- psu -->
    <rect x="20" y="248" width="120" height="66" rx="8" fill="#e9e3d7" stroke="#15171a" stroke-width="2"/>
    <circle cx="80" cy="281" r="20" fill="none" stroke="#15171a" stroke-width="2"/>
    <path d="M66 281h28M80 267v28" stroke="#15171a" stroke-width="2" opacity=".5"/>
    <!-- drive bays -->
    <rect x="210" y="24" width="28" height="22" rx="4" fill="#e9e3d7" stroke="#15171a" stroke-width="2"/>
    <rect x="210" y="54" width="28" height="22" rx="4" fill="#e9e3d7" stroke="#15171a" stroke-width="2"/>
    <!-- cable -->
    <path d="M140 284c40 0 50-40 80-60" fill="none" stroke="#15171a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- screwdriver -->
  <g transform="translate(452 330) rotate(-38)">
    <rect x="5" y="5" width="90" height="34" rx="16" fill="#15171a"/>
    <rect width="90" height="34" rx="16" fill="#ff5a1f" stroke="#15171a" stroke-width="3"/>
    <path d="M20 9v16M36 9v16M52 9v16" stroke="#15171a" stroke-width="2.5" stroke-linecap="round" opacity=".55"/>
    <rect x="88" y="12" width="80" height="10" rx="3" fill="#c9cdd2" stroke="#15171a" stroke-width="2.5"/>
    <path d="M166 12l12 5-12 5z" fill="#15171a"/>
  </g>

  <!-- diagnostics card -->
  <g transform="translate(436 54)">
    <rect x="5" y="6" width="150" height="112" rx="14" fill="#15171a"/>
    <rect width="150" height="112" rx="14" fill="#f8f6f1" stroke="#15171a" stroke-width="2.5"/>
    <path d="M30 78a45 45 0 0 1 90 0" fill="none" stroke="#15171a" stroke-width="10" stroke-linecap="round" opacity=".14"/>
    <path d="M30 78a45 45 0 0 1 72-36" fill="none" stroke="#ff5a1f" stroke-width="10" stroke-linecap="round"/>
    <path d="M75 78l20-24" stroke="#15171a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="75" cy="78" r="7" fill="#15171a"/>
    <rect x="44" y="92" width="62" height="8" rx="4" fill="#15171a" opacity=".3"/>
  </g>
</svg>
