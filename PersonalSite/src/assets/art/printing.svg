<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- 3D modelling and printing: a wireframe model on a blueprint grid,
       and an enclosed CoreXY printer partway through printing it. -->
  <rect width="800" height="600" fill="#1d2733"/>
  <path d="M40 0V600M80 0V600M120 0V600M160 0V600M200 0V600M240 0V600M280 0V600M320 0V600M360 0V600M400 0V600M440 0V600M480 0V600M520 0V600M560 0V600M600 0V600M640 0V600M680 0V600M720 0V600M760 0V600M0 40H800M0 80H800M0 120H800M0 160H800M0 200H800M0 240H800M0 280H800M0 320H800M0 360H800M0 400H800M0 440H800M0 480H800M0 520H800M0 560H800" stroke="#cfe1f5" stroke-width="1" opacity=".08"/>
  <path d="M200 0V600M400 0V600M600 0V600M0 200H800M0 400H800" stroke="#cfe1f5" stroke-width="1" opacity=".16"/>

  <!-- the model: a vase in wireframe, with a dimension line beside it -->
  <g fill="none" stroke="#f8f6f1" stroke-linejoin="round" stroke-linecap="round">
    <g stroke-width="1.5" opacity=".45">
      <ellipse cx="210" cy="430" rx="60" ry="13"/>
      <ellipse cx="210" cy="386" rx="71" ry="15.5"/>
      <ellipse cx="210" cy="342" rx="74" ry="16.5"/>
      <ellipse cx="210" cy="298" rx="71" ry="15.5"/>
      <ellipse cx="210" cy="254" rx="60" ry="13"/>
      <ellipse cx="210" cy="210" rx="42" ry="9"/>
      <path d="M252 437L260 397 262 353 260 309 252 263 240 216M168 437L160 397 158 353 160 309 168 263 180 216"/>
    </g>
    <path d="M150 430L139 386 136 342 139 298 150 254 168 210M270 430L281 386 284 342 281 298 270 254 252 210" stroke-width="2.5" opacity=".9"/>
    <path d="M104 210V430M96 210h16M96 430h16" stroke-width="2" opacity=".55"/>
  </g>
  <g fill="#ff5a1f" stroke="#15171a" stroke-width="2">
    <circle cx="150" cy="430" r="5"/><circle cx="270" cy="430" r="5"/>
    <circle cx="136" cy="342" r="5"/><circle cx="284" cy="342" r="5"/>
    <circle cx="168" cy="210" r="5"/><circle cx="252" cy="210" r="5"/>
  </g>

  <!-- from the screen to the printer -->
  <path d="M300 318C336 300 362 300 392 314" fill="none" stroke="#f8f6f1" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 9" opacity=".7"/>
  <path d="M380 304l14 11-17 4" fill="none" stroke="#f8f6f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>

  <!-- the printer: an enclosed cube with a glass front -->
  <rect x="420" y="142" width="280" height="370" rx="18" fill="#000" opacity=".35"/>
  <rect x="410" y="130" width="280" height="370" rx="18" fill="#15171a" stroke="#15171a" stroke-width="3"/>
  <rect x="410" y="130" width="280" height="34" rx="18" fill="#262b31"/>
  <rect x="428" y="172" width="244" height="258" rx="8" fill="#2a3440" stroke="#0e1013" stroke-width="3"/>
  <path d="M470 172l-42 70v-40l18-30zM560 172L428 392v-46l104-174z" fill="#f8f6f1" opacity=".05"/>

  <!-- inside: the bed, the print so far, the gantry and the head -->
  <rect x="448" y="400" width="204" height="10" rx="3" fill="#9aa5b1" stroke="#0e1013" stroke-width="2"/>
  <g fill="#f8f6f1">
    <rect x="498" y="393" width="104" height="7" rx="3"/>
    <rect x="495" y="386" width="110" height="7" rx="3"/>
    <rect x="492.5" y="379" width="115" height="7" rx="3"/>
    <rect x="490.5" y="372" width="119" height="7" rx="3"/>
    <rect x="489" y="365" width="122" height="7" rx="3"/>
    <rect x="488" y="358" width="124" height="7" rx="3"/>
    <rect x="488" y="351" width="124" height="7" rx="3"/>
    <rect x="488.5" y="344" width="123" height="7" rx="3"/>
    <rect x="489.5" y="337" width="121" height="7" rx="3"/>
    <rect x="491" y="330" width="118" height="7" rx="3"/>
  </g>
  <path d="M498 393h104M495 386h110M492.5 379h115M490.5 372h119M489 365h122M488 358h124M488 351h124M488.5 344h123M489.5 337h121M491 330h118" stroke="#15171a" stroke-width="1" opacity=".22"/>
  <rect x="493.5" y="323" width="113" height="7" rx="3" fill="#ff5a1f"/>
  <rect x="434" y="282" width="232" height="9" rx="4" fill="#5b6672" stroke="#0e1013" stroke-width="2"/>
  <rect x="528" y="268" width="44" height="40" rx="7" fill="#f8f6f1" stroke="#15171a" stroke-width="2.5"/>
  <circle cx="550" cy="288" r="10" fill="none" stroke="#15171a" stroke-width="2"/>
  <path d="M550 280v16M542 288h16" stroke="#15171a" stroke-width="1.5" opacity=".5"/>
  <path d="M543 308h14l-7 13z" fill="#c9ced4" stroke="#15171a" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="550" cy="322" r="6" fill="#ffb08a" opacity=".7"/>

  <!-- the front panel: a small screen with the print's progress -->
  <rect x="436" y="448" width="58" height="32" rx="5" fill="#2f3b48" stroke="#0e1013" stroke-width="2"/>
  <rect x="444" y="456" width="30" height="4" rx="2" fill="#f8f6f1" opacity=".5"/>
  <rect x="444" y="467" width="42" height="5" rx="2.5" fill="#f8f6f1" opacity=".15"/>
  <rect x="444" y="467" width="28" height="5" rx="2.5" fill="#ff5a1f"/>
  <circle cx="660" cy="464" r="6" fill="#ff5a1f"/>

  <!-- the spool beside the printer, feeding in over the top -->
  <g transform="translate(746 232)">
    <circle r="40" fill="#000" transform="translate(5 7)" opacity=".35"/>
    <circle r="40" fill="#ff5a1f" stroke="#15171a" stroke-width="3"/>
    <circle r="32" fill="none" stroke="#15171a" stroke-width="1.5" opacity=".3"/>
    <circle r="25" fill="none" stroke="#15171a" stroke-width="1.5" opacity=".3"/>
    <circle r="17" fill="#f8f6f1" stroke="#15171a" stroke-width="3"/>
    <circle r="5.5" fill="#15171a"/>
  </g>
  <path d="M736 193C722 140 660 110 602 132" fill="none" stroke="#ff5a1f" stroke-width="3" stroke-linecap="round"/>

  <!-- sparks -->
  <path d="M352 168c2.5 9 6 12.5 15 15-9 2.5-12.5 6-15 15-2.5-9-6-12.5-15-15 9-2.5 12.5-6 15-15z" fill="#f8f6f1"/>
  <path d="M96 506c1.6 6 4 8.4 10 10-6 1.6-8.4 4-10 10-1.6-6-4-8.4-10-10 6-1.6 8.4-4 10-10z" fill="#f8f6f1" opacity=".7"/>
</svg>
