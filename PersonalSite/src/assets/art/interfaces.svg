<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#15171a" opacity=".16"/>
    </pattern>
  </defs>
  <rect width="640" height="420" fill="#e9e3d7"/>
  <rect width="640" height="420" fill="url(#dots)"/>

  <!-- back window -->
  <g transform="translate(190 46)">
    <rect width="390" height="250" rx="14" fill="#ddd5c6" stroke="#15171a" stroke-width="2"/>
    <path d="M0 34h390" stroke="#15171a" stroke-width="2"/>
    <circle cx="20" cy="17" r="5" fill="#15171a"/>
    <circle cx="38" cy="17" r="5" fill="#15171a" opacity=".45"/>
    <circle cx="56" cy="17" r="5" fill="#15171a" opacity=".45"/>
    <rect x="24" y="58" width="150" height="12" rx="6" fill="#15171a" opacity=".25"/>
    <rect x="24" y="80" width="110" height="12" rx="6" fill="#15171a" opacity=".18"/>
  </g>

  <!-- front window -->
  <g transform="translate(64 104)">
    <rect x="6" y="8" width="420" height="272" rx="16" fill="#15171a"/>
    <rect width="420" height="272" rx="16" fill="#f8f6f1" stroke="#15171a" stroke-width="2"/>
    <path d="M0 36h420" stroke="#15171a" stroke-width="2"/>
    <circle cx="20" cy="18" r="5" fill="#ff5a1f"/>
    <circle cx="38" cy="18" r="5" fill="#15171a" opacity=".35"/>
    <circle cx="56" cy="18" r="5" fill="#15171a" opacity=".35"/>
    <rect x="150" y="11" width="160" height="14" rx="7" fill="#15171a" opacity=".08"/>

    <!-- sidebar -->
    <path d="M96 36v236" stroke="#15171a" stroke-width="2" opacity=".15"/>
    <rect x="18" y="56" width="58" height="10" rx="5" fill="#15171a"/>
    <rect x="18" y="82" width="48" height="8" rx="4" fill="#15171a" opacity=".3"/>
    <rect x="18" y="102" width="54" height="8" rx="4" fill="#15171a" opacity=".3"/>
    <rect x="12" y="118" width="72" height="22" rx="6" fill="#ff5a1f" opacity=".16"/>
    <rect x="18" y="125" width="44" height="8" rx="4" fill="#ff5a1f"/>
    <rect x="18" y="150" width="50" height="8" rx="4" fill="#15171a" opacity=".3"/>

    <!-- header -->
    <rect x="116" y="56" width="140" height="14" rx="7" fill="#15171a"/>
    <rect x="116" y="78" width="200" height="8" rx="4" fill="#15171a" opacity=".25"/>

    <!-- cards -->
    <g>
      <rect x="116" y="104" width="88" height="70" rx="10" fill="#efeae0" stroke="#15171a" stroke-width="1.5"/>
      <rect x="128" y="118" width="40" height="7" rx="3.5" fill="#15171a" opacity=".35"/>
      <rect x="128" y="134" width="56" height="18" rx="4" fill="#15171a"/>
      <rect x="216" y="104" width="88" height="70" rx="10" fill="#efeae0" stroke="#15171a" stroke-width="1.5"/>
      <rect x="228" y="118" width="40" height="7" rx="3.5" fill="#15171a" opacity=".35"/>
      <rect x="228" y="134" width="46" height="18" rx="4" fill="#ff5a1f"/>
      <rect x="316" y="104" width="88" height="70" rx="10" fill="#efeae0" stroke="#15171a" stroke-width="1.5"/>
      <path d="M326 160l14-12 12 6 16-20 14 8 12-14" fill="none" stroke="#15171a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- list + toggle -->
    <rect x="116" y="190" width="288" height="62" rx="10" fill="#efeae0" stroke="#15171a" stroke-width="1.5"/>
    <circle cx="138" cy="210" r="8" fill="#15171a" opacity=".2"/>
    <rect x="154" y="206" width="120" height="8" rx="4" fill="#15171a" opacity=".4"/>
    <circle cx="138" cy="234" r="8" fill="#15171a" opacity=".2"/>
    <rect x="154" y="230" width="90" height="8" rx="4" fill="#15171a" opacity=".4"/>
    <rect x="352" y="200" width="36" height="20" rx="10" fill="#ff5a1f"/>
    <circle cx="378" cy="210" r="7" fill="#f8f6f1"/>
    <rect x="352" y="226" width="36" height="20" rx="10" fill="#15171a" opacity=".2"/>
    <circle cx="362" cy="236" r="7" fill="#f8f6f1"/>
  </g>

  <!-- cursor -->
  <g transform="translate(442 318) rotate(-8)">
    <path d="M0 0l0 44 12-11 9 20 9-4-9-19 16-1z" fill="#15171a" stroke="#f8f6f1" stroke-width="3" stroke-linejoin="round"/>
