<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#15171a" stroke-width="1" opacity=".08"/>
    </pattern>
  </defs>
  <rect width="640" height="420" fill="#e9e3d7"/>
  <rect width="640" height="420" fill="url(#grid)"/>

  <!-- script window -->
  <g transform="translate(60 54)">
    <rect x="6" y="8" width="320" height="216" rx="16" fill="#15171a"/>
    <rect width="320" height="216" rx="16" fill="#1b1e22" stroke="#15171a" stroke-width="3"/>
    <path d="M16 0h288a16 16 0 0 1 16 16v18H0V16A16 16 0 0 1 16 0z" fill="#f8f6f1" stroke="#15171a" stroke-width="3"/>
    <circle cx="20" cy="17" r="5" fill="#ff5a1f"/>
    <circle cx="38" cy="17" r="5" fill="#15171a" opacity=".35"/>
    <circle cx="56" cy="17" r="5" fill="#15171a" opacity=".35"/>
    <!-- lines of script -->
    <path d="M22 62l10 8-10 8" fill="none" stroke="#ff5a1f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="42" y="64" width="70" height="10" rx="5" fill="#ff5a1f"/>
    <rect x="120" y="64" width="54" height="10" rx="5" fill="#f8f6f1" opacity=".55"/>
    <rect x="182" y="64" width="40" height="10" rx="5" fill="#f8f6f1" opacity=".3"/>
    <rect x="42" y="88" width="40" height="10" rx="5" fill="#f8f6f1" opacity=".3"/>
    <rect x="90" y="88" width="96" height="10" rx="5" fill="#f8f6f1" opacity=".55"/>
    <rect x="62" y="112" width="120" height="10" rx="5" fill="#f8f6f1" opacity=".55"/>
    <rect x="190" y="112" width="58" height="10" rx="5" fill="#ff5a1f" opacity=".8"/>
    <rect x="62" y="136" width="84" height="10" rx="5" fill="#f8f6f1" opacity=".3"/>
    <rect x="42" y="160" width="30" height="10" rx="5" fill="#f8f6f1" opacity=".55"/>
    <path d="M22 188l10 8-10 8" fill="none" stroke="#ff5a1f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="42" y="191" width="12" height="12" fill="#f8f6f1"/>
  </g>

  <!-- clock: runs on a schedule -->
  <g transform="translate(470 120)">
    <circle cx="6" cy="8" r="74" fill="#15171a"/>
    <circle r="74" fill="#f8f6f1" stroke="#15171a" stroke-width="3"/>
    <path d="M0-58A58 58 0 0 1 50 29" fill="none" stroke="#ff5a1f" stroke-width="10" stroke-linecap="round"/>
    <path d="M42 22l10 9 4-14" fill="none" stroke="#15171a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke="#15171a" stroke-width="3" stroke-linecap="round" opacity=".4">
      <path d="M0-64v8M0 56v8M-64 0h8M56 0h8"/>
    </g>
    <path d="M0 0V-34M0 0l22 14" stroke="#15171a" stroke-width="5" stroke-linecap="round"/>
    <circle r="6" fill="#15171a"/>
  </g>

  <!-- task chain -->
  <g transform="translate(60 312)">
    <g stroke="#15171a" stroke-width="2.5">
      <rect x="4" y="5" width="120" height="50" rx="12" fill="#15171a"/>
      <rect width="120" height="50" rx="12" fill="#f8f6f1"/>
      <rect x="184" y="5" width="120" height="50" rx="12" fill="#15171a"/>
      <rect x="180" width="120" height="50" rx="12" fill="#f8f6f1"/>
      <rect x="364" y="5" width="156" height="50" rx="12" fill="#15171a"/>
      <rect x="360" width="156" height="50" rx="12" fill="#ff5a1f"/>
    </g>
    <g fill="#15171a">
      <rect x="18" y="20" width="70" height="10" rx="5" opacity=".35"/>
      <rect x="198" y="20" width="70" height="10" rx="5" opacity=".35"/>
      <rect x="406" y="20" width="84" height="10" rx="5"/>
    </g>
    <path d="M378 25l6 6 12-13" fill="none" stroke="#15171a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="none" stroke="#15171a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M130 25h40m-8-8 8 8-8 8"/>
      <path d="M310 25h40m-8-8 8 8-8 8"/>
    </g>
  </g>
</svg>
